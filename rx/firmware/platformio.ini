; LibreRID-RX v0 – Ground-Receiver für Remote ID (BLE4 Legacy + BLE5 Long Range)
; Board: ESP32-S3-DevKitC-1 N16R8 (gemessen: rev v0.2, 8 MB PSRAM)
[env:esp32-s3-n16r8]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ; Debuggen über die USB-UART-Buchse: SerCon ohne diese beiden Flags auf UART0.
    ; (Mit ihnen geht Serial an den nativen USB-Port – dort stirbt der Strom
    ;  nach jedem Reset, siehe Skill librerid-firmware.)
    -D BOARD_HAS_PSRAM
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
